services:
  # API Gateway - Node.js
  - type: web
    name: careerforge-api-gateway
    env: node
    rootDir: backend/api-gateway
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: careerforge-ai-brain
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: COGNITIVE_SERVICE_URL
        fromService:
          type: web
          name: careerforge-cognitive-screener
          envVarKey: RENDER_INTERNAL_HOSTNAME

  # AI Brain - Python
  - type: web
    name: careerforge-ai-brain
    env: python
    rootDir: backend/microservices/ai-brain
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        sync: false

  # Cognitive Screener - Python
  - type: web
    name: careerforge-cognitive-screener
    env: python
    rootDir: backend/microservices/cognitive-screener
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        sync: false

  # Frontend - React (Static Site)
  - type: web # Using web instead of static because it's a dynamic react app that needs serve or similar, but static is better for create-react-app if we just serve the build folder. Let's stick to node/web for simplicity unless it's a pure static build. Actually, Render supports 'static' for React apps very well. Let's use static.
    
  - type: web
    name: careerforge-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: careerforge-api-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_SOCKET_URL
        fromService:
          type: web
          name: careerforge-api-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: 18

      # You can add the other services (adaptive-interviewer, autonomous-headhunter, analytics-manager) here as well using the same Python pattern if they exist in your codebase yet.
